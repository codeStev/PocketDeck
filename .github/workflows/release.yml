name: Release

# Merging develop into main releases the version in version.properties: the workflow tags it, builds the signed APK
# and publishes a GitHub release. A merge without a version bump fails on purpose (the tag already exists).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version and refuse one that is already released
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump version.properties on develop first."
            exit 1
          fi
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pocketdeck
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.pocketdeck/release.jks
          {
            echo "storeFile=$HOME/.pocketdeck/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.pocketdeck/signing.properties
      - name: Signed release build
        run: ./gradlew :app:assembleRelease
      - name: Name the APK and compute its SHA-256
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/PocketDeck-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Release notes: the matching section of CHANGELOG.md, else GitHub's generated notes.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md 2>/dev/null || true
          args=(--target "$GITHUB_SHA" --title "PocketDeck $VERSION")
          [ -s notes.md ] && args+=(--notes-file notes.md) || args+=(--generate-notes)
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "v$VERSION" dist/* "${args[@]}"
