name: Release

# The owner tags a commit on main (v<version>) and publishes a GitHub release for the tag by hand, with the notes from
# CHANGELOG.md. Publishing starts this workflow: it builds the signed APK and attaches it and its SHA-256 to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Refuse a tag that does not match version.properties
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Tag ${{ github.event.release.tag_name }} but version.properties says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pocketdeck
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.pocketdeck/release.jks
          {
            echo "storeFile=$HOME/.pocketdeck/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.pocketdeck/signing.properties
      - name: Signed release build
        run: ./gradlew :app:assembleRelease
      - name: Name the APK and compute its SHA-256
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/PocketDeck-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  fdroid:
    # Final releases only: a pre-release must not reach the people who follow the repository.
    if: ${{ !github.event.release.prerelease }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fdroidserver markdown segno
      - name: Fetch the signed APK of this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" --pattern '*.apk' --dir new
      - name: Check out the published repository (gh-pages)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add pages FETCH_HEAD
          else
            git worktree add --detach pages
            git -C pages checkout --orphan gh-pages
            git -C pages rm -rf . >/dev/null
          fi
      - name: Add the APK and rebuild the index
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          mkdir -p work/repo
          cp -r pages/repo/. work/repo/ 2>/dev/null || true
          cp new/*.apk work/repo/
          cp -r fdroid/metadata work/metadata
          # The localized listing (title, descriptions, changelog) is the same fastlane folder the app repository carries.
          mkdir -p work/metadata/io.github.codestev.pocketdeck
          cp -r fastlane/metadata/android/. work/metadata/io.github.codestev.pocketdeck/
          echo "$KEYSTORE_BASE64" | base64 -d > work/keystore.jks
          # fdroid signs the index with the SDK's apksigner and has no default for where it is.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          export APKSIGNER
          python3 - > work/config.yml <<'PY'
          import json, os
          values = {
              "repo_url": "https://codestev.github.io/PocketDeck/repo",
              "repo_name": "PocketDeck",
              "repo_description": "Releases of PocketDeck, an unofficial companion for Pokémon TCG Pocket.",
              "repo_keyalias": os.environ["KEY_ALIAS"],
              "keystore": "keystore.jks",
              "keystorepass": os.environ["KEYSTORE_PASSWORD"],
              "keypass": os.environ["KEYSTORE_PASSWORD"],
              "apksigner": os.environ["APKSIGNER"],
          }
          # A JSON string is a valid YAML scalar: a password that starts with @ or contains quotes or # survives, which a bare value does not.
          for key, value in values.items():
              print(f"{key}: {json.dumps(value, ensure_ascii=False)}")
          PY
          chmod 600 work/config.yml
          (cd work && fdroid update)
          mkdir -p pages/repo
          rsync -a --delete work/repo/ pages/repo/
          touch pages/.nojekyll
      - name: Build the site around the repository
        # The landing page, privacy policy and changelog come from the Markdown files of this tag, with the fingerprint of the key
        # that signed the index just written, so the page always shows the current one. The repository is what matters: if the
        # site cannot be built, it is still published and this step only shows as a warning.
        continue-on-error: true
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          FINGERPRINT=$(keytool -printcert -jarfile work/repo/index-v1.jar | sed -n 's/.*SHA256: //p' | tr -d ':')
          python3 scripts/build-site.py pages --version "${TAG#v}" --fingerprint "$FINGERPRINT"
      - name: Publish
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "F-Droid repository: ${{ github.event.release.tag_name }}"
          git push origin HEAD:gh-pages
