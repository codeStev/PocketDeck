name: Release

# The owner tags a commit on main (v<version>) and publishes a GitHub release for the tag by hand, with the notes from
# CHANGELOG.md. Publishing starts this workflow: it builds the signed APK and attaches it and its SHA-256 to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Refuse a tag that does not match version.properties
        id: version
        run: |
          version=$(sed -n 's/^version=//p' version.properties)
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::Tag ${{ github.event.release.tag_name }} but version.properties says $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pocketdeck
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.pocketdeck/release.jks
          {
            echo "storeFile=$HOME/.pocketdeck/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.pocketdeck/signing.properties
      - name: Signed release build
        run: ./gradlew :app:assembleRelease
      - name: Name the APK and compute its SHA-256
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/PocketDeck-${{ steps.version.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
