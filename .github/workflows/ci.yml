name: CI

# Every change is checked before it reaches develop or main (pull requests); pushes to develop, release and hotfix branches
# also build a release candidate.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request makes the older run pointless; a push to develop is a release candidate and must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release candidate number counts commits since main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint, Android Lint, Konsist, unit tests
        run: ./gradlew check
      - name: Release build (unsigned, R8 on)
        run: ./gradlew :app:assembleRelease
      - name: Licences of the libraries in the release build
        run: python3 scripts/licence-scan.py

  smoke-test:
    # The unit tests never run the minified code. This starts the R8 build on an emulator, clicks through the welcome tour and
    # every tab, and fails on a crash (reflection-based code such as Room, Hilt and serialization breaks this way).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Release build, signed with the debug key
        run: ./gradlew :app:assembleRelease -Ppocketdeck.signWithDebugKey=true
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/smoke-test.py app/build/outputs/apk/release/app-release.apk

  release-candidate:
    # Every change that reaches develop, a release or a hotfix branch is a new release candidate of that branch's version: 1.0.0-rc.N,
    # N = commits on the branch since main. Signed with the release key (same app id, so testers update in place) and kept as a workflow artifact.
    if: github.event_name == 'push'
    needs: [check, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pocketdeck
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.pocketdeck/release.jks
          {
            echo "storeFile=$HOME/.pocketdeck/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.pocketdeck/signing.properties
      - name: Build the release candidate
        run: |
          rc=$(git rev-list --count origin/main..HEAD)
          ./gradlew :app:assembleRelease -Ppocketdeck.rc="$rc"
          version=$(sed -n 's/^version=//p' version.properties)
          mkdir dist && cp app/build/outputs/apk/release/*.apk "dist/PocketDeck-$version-rc.$rc.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/*
          retention-days: 30
