name: CI

# Every change is checked before it reaches develop or main (pull requests) and after (pushes).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release candidate number counts commits since main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint, Android Lint, Konsist, unit tests
        run: ./gradlew check
      - name: Release build (unsigned, R8 on)
        run: ./gradlew :app:assembleRelease

  release-candidate:
    # Every change that reaches develop is a new release candidate of the next version: 1.0.0-rc.N, N = commits on develop
    # since main. Signed with the release key (same app id, so testers update in place) and kept as a workflow artifact.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Write the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.pocketdeck
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.pocketdeck/release.jks
          {
            echo "storeFile=$HOME/.pocketdeck/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ~/.pocketdeck/signing.properties
      - name: Build the release candidate
        run: |
          rc=$(git rev-list --count origin/main..HEAD)
          ./gradlew :app:assembleRelease -Ppocketdeck.rc="$rc"
          version=$(sed -n 's/^version=//p' version.properties)
          mkdir dist && cp app/build/outputs/apk/release/*.apk "dist/PocketDeck-$version-rc.$rc.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/*
          retention-days: 30
